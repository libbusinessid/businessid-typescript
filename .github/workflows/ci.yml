name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole suite at the commit it publishes,
  # rather than repeating a subset of it.
  workflow_call:
  # `rules-sync` asks for this explicitly on the branch it just pushed. A pull
  # request opened with GITHUB_TOKEN starts no `pull_request` run — GitHub
  # refuses to let that token trigger further workflows — and `workflow_dispatch`
  # is one of the two documented exceptions. The run it starts attaches its check
  # runs to the head commit of the branch, so they land on the pull request like
  # any other.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `engine.md` section 12.5: one entry point runs the whole verification, and
  # it is what CI calls, so "green" never has two definitions — the one a
  # developer sees and the one integration sees. Splitting this back into a job
  # per script would recreate exactly that gap.
  verify:
    name: verify on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The conformance runner is a Go program from the spec repository, pinned
      # to the commit rules.lock records. A build tool: it enters neither the
      # published package nor its dependencies.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile
      # The browser project runs the same engine with no Node API in sight, and
      # needs a real browser to do it.
      - run: pnpm exec playwright install --with-deps chromium
      # setup-go sets GOTOOLCHAIN to `local`. The binding condition is the `go`
      # line of the spec module rather than its `toolchain` line, and resolving
      # `stable` never meets it — this is insurance for the day that line moves.
      - run: pnpm verify
        env:
          GOTOOLCHAIN: auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.node == '22.x'
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # A different question from the one above, not a second definition of green.
  # `engines` claims Node 20.11, which is about the published package: no
  # dependencies, nothing that reads a file or the network. What proves that
  # claim is the engine's own suite and the packed tarball installed in a blank
  # project, both run through the same entry point and the same step
  # definitions.
  #
  # The browser project cannot be part of it. Its toolchain calls `crypto.hash`,
  # added in Node 20.12, so `vite` cannot start on 20.11 at all — and running it
  # there would measure the toolchain rather than the engine. This is what the
  # collapse into one command surfaced: while the browser had its own job pinned
  # to 22.x, nothing ever asked the question.
  compat:
    name: engine on node 20.11, the supported floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.11"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify "tests (node)" "packaging"
